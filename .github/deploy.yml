name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: Setup Node.js if using React/Vite/etc
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Optional: Install dependencies
      - name: Install dependencies
        run: npm install

      # Optional: Build project
      # For Vite/React use:
      - name: Build project
        run: npm run build

      # If plain HTML/CSS/JS site,
      # remove install/build steps above

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload build output
      # For Vite use: dist
      # For React CRA use: build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4